name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Загрузка платформы
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Установка зависимостей
        run: npm ci
      - name: Тесты
        run: npm test
