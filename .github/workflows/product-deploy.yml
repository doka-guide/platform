name: Product Deploy

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # Сборка вынесена в переиспользуемый воркфлоу: раньше на каждый push в main
  # сайт собирался дважды — здесь и в отдельной джобе W3C-валидации.
  build:
    name: Сборка сайта
    uses: ./.github/workflows/build-site.yml
    # Переиспользуемый воркфлоу не может запросить больше прав, чем дал вызывающий,
    # а на уровне воркфлоу стоит permissions: {} — поэтому выдаём чтение здесь.
    permissions:
      contents: read
    with:
      cache-prefix: product
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  # Валидация разметки. Собранные страницы приезжают артефактом, поэтому джоба
  # не пересобирает сайт и не нуждается ни в контенте, ни в секретах.
  validate:
    name: Валидация разметки
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Загрузка платформы
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          architecture: x64
      - name: Установка модулей
        run: npm ci
      - name: Загрузка страниц
        uses: actions/download-artifact@v4
        with:
          name: site-html
      - name: Распаковка страниц
        run: |
          set -eu
          mkdir -p dist
          tar --extract --file site-html.tar --directory dist \
            --no-same-owner --no-same-permissions
      - name: Валидация
        run: npm run lint:html

  # Публикация на продакшн. Намеренно зависит только от сборки, а не от
  # валидации: до выноса сборки это были два независимых воркфлоу, и красная
  # разметка выкатку не останавливала. Если захотим гейт — это отдельное
  # решение, а не побочный эффект переезда на артефакты.
  deploy:
    name: Публикация сайта
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Загрузка артефакта
        uses: actions/download-artifact@v4
        with:
          name: site-dist
      - name: Распаковка артефакта
        run: |
          set -eu
          SITE_DIR="$(mktemp -d "$RUNNER_TEMP/site.XXXXXX")"
          tar --extract --file site.tar --directory "$SITE_DIR" --no-same-owner --no-same-permissions
          test -f "$SITE_DIR/index.html" || { echo "В артефакте нет index.html"; exit 1; }
          echo "SITE_DIR=$SITE_DIR" >> "$GITHUB_ENV"
      # Последовательность та же, что и до выноса сборки: ключ, конфиг и
      # холостое подключение, которое добавляет хост в known_hosts.
      - name: Установка ключа для пользователя
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/doka_deploy"
          chmod 600 "$HOME/.ssh/doka_deploy"
          printf '%s\n' "$DEPLOY_CONFIG" > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh -o StrictHostKeyChecking=no deploy@dev.doka.guide
      - name: Публикация сайта
        run: |
          set -eu
          cd "$SITE_DIR"
          rsync --exclude 'api.json' --exclude 'mail' \
            --archive --progress --compress --delete \
            . dev.doka.guide:/web/sites/doka.guide/www/
