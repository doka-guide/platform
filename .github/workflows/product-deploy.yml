name: Product Deploy

# Ручной запуск нужен репозиторию контента: после обслуживания main он
# вызывает эту выкатку, а не собирает сайт сам. Так у прода одна очередь и
# одни предохранители на оба репозитория.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# Публикации идут строго по одной. Два параллельных rsync в одну папку
# перемешивают файлы двух сборок: так 20 ноября 2026 после почти одновременных
# #1388 и #1389 индексы html и css остались старыми, а остальные — новыми.
#
# Группа стоит на весь воркфлоу, а не на джобу публикации. Иначе порядок
# выкатки задаёт то, какая сборка закончилась раньше, и старый коммит может
# доехать последним.
#
# Новый запуск ждёт, а не отменяет текущий. Отмена может прийти посреди rsync:
# на сервере останется смесь, и она провисит, пока новый запуск собирает сайт.
# Последний коммит всё равно побеждает: в очереди GitHub держит только самый
# свежий запуск, а промежуточные отменяет до старта.
concurrency:
  group: product-deploy
  cancel-in-progress: false

jobs:
  # Сборка вынесена в переиспользуемый воркфлоу: раньше на каждый push в main
  # сайт собирался дважды — здесь и в отдельной джобе W3C-валидации.
  build:
    name: Сборка сайта
    uses: ./.github/workflows/build-site.yml
    # Ручной запуск позволяет выбрать любую ветку. На прод едет только main.
    if: ${{ github.ref == 'refs/heads/main' }}
    # Переиспользуемый воркфлоу не может запросить больше прав, чем дал вызывающий,
    # а на уровне воркфлоу стоит permissions: {} — поэтому выдаём чтение здесь.
    permissions:
      contents: read

  # Валидация разметки. Собранные страницы приезжают артефактом, поэтому джоба
  # не пересобирает сайт и не нуждается ни в контенте, ни в секретах.
  validate:
    name: Валидация разметки
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Загрузка платформы
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 17
          distribution: 'temurin'
          architecture: x64
      - name: Установка модулей
        run: npm ci
      - name: Загрузка страниц
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-html
      - name: Распаковка страниц
        run: |
          set -eu
          mkdir -p dist
          tar --extract --file site-html.tar --directory dist \
            --no-same-owner --no-same-permissions
      - name: Валидация
        run: npm run lint:html

  # Публикация на продакшн. Намеренно зависит только от сборки, а не от
  # валидации: до выноса сборки это были два независимых воркфлоу, и красная
  # разметка выкатку не останавливала. Если захотим гейт — это отдельное
  # решение, а не побочный эффект переезда на артефакты.
  deploy:
    # По этому имени выкатку ждёт product-deploy.yml репозитория контента.
    name: Публикация сайта
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Загрузка артефакта
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
      # Дальше идёт rsync с --delete, поэтому неполный артефакт опаснее
      # упавшего деплоя: он не оставит старую версию, а сотрёт недостающее.
      # Проверяем контрольную сумму до распаковки и опись после, чтобы до
      # сервера не доехал обрезанный или пустой архив.
      - name: Проверка артефакта
        run: |
          set -eu
          test -f site-manifest.txt || { echo "В артефакте нет описи"; exit 1; }
          # Разбираем grep-ом, а не source: опись — данные, а не код.
          EXPECTED_SHA="$(grep '^sha256=' site-manifest.txt | cut -d= -f2)"
          ACTUAL_SHA="$(sha256sum site.tar | cut -d' ' -f1)"
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "Архив побился при передаче: ждали $EXPECTED_SHA, получили $ACTUAL_SHA"
            exit 1
          fi
          echo "EXPECTED_FILES=$(grep '^files=' site-manifest.txt | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "EXPECTED_HTML=$(grep '^html=' site-manifest.txt | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: Распаковка артефакта
        run: |
          set -eu
          SITE_DIR="$(mktemp -d "$RUNNER_TEMP/site.XXXXXX")"
          tar --extract --file site.tar --directory "$SITE_DIR" --no-same-owner --no-same-permissions
          test -f "$SITE_DIR/index.html" || { echo "В артефакте нет index.html"; exit 1; }
          ACTUAL_FILES="$(find "$SITE_DIR" -type f | wc -l | tr -d ' ')"
          if [ "$ACTUAL_FILES" -ne "$EXPECTED_FILES" ]; then
            echo "Распаковалось $ACTUAL_FILES файлов вместо $EXPECTED_FILES"
            exit 1
          fi
          # Нижняя граница на случай сборки, которая формально удалась, но выдала
          # почти пустой dist. Сейчас страниц около 4500, запас многократный.
          if [ "$EXPECTED_HTML" -lt 1000 ]; then
            echo "Подозрительно мало страниц: $EXPECTED_HTML"
            exit 1
          fi
          echo "SITE_DIR=$SITE_DIR" >> "$GITHUB_ENV"
      # Последовательность та же, что и до выноса сборки: ключ, конфиг и
      # холостое подключение, которое добавляет хост в known_hosts.
      - name: Установка ключа для пользователя
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/doka_deploy"
          chmod 600 "$HOME/.ssh/doka_deploy"
          printf '%s\n' "$DEPLOY_CONFIG" > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 deploy@dev.doka.guide
      # --delete-after: сначала переливаются все файлы и только потом удаляются
      # лишние. Если передача оборвётся на середине, не удалится ничего — на
      # сервере останется прежняя версия плюс частично долитая новая. При
      # удалении по ходу (поведение --delete по умолчанию) оборванная передача
      # оставила бы сайт с уже вычищенными файлами.
      #
      # --max-delete — последний предохранитель на уровне rsync: если неполный
      # артефакт всё же прошёл сверку описи, rsync прервётся с кодом 25 и не
      # станет вычищать боевой сайт.
      #
      # Порог считается от размера сборки, а не фиксированным числом. Круглые
      # 500 уже один раз остановили штатную выкатку: на сервере накапливаются
      # сгенерированные картинки с прежними хэшами, и законная уборка легко
      # выходит за любое ровное значение. Пятая часть от числа файлов в
      # артефакте — это около двух тысяч при нынешних десяти с половиной, чего
      # хватает на уборку, но катастрофу с почти пустой сборкой всё ещё ловит.
      #
      # --checksum, потому что у свежей сборки новые даты у всех файлов, и по
      # размеру с датой rsync переписывал на боевом сайте почти каждый файл.
      # По содержимому меняются только действительно изменённые.
      #
      # Исключения с якорем: `/mail` и `/api.json` лежат только в корне прода и
      # приезжают не из этой сборки. Без `/` rsync исключал любой путь с таким
      # именем, и демка html/a/demos/mail/ не обновлялась с января 2025 года.
      #
      # Таймауты — как у превью. Соединение иногда замирает посреди передачи:
      # ssh жив, данные не идут, и без --timeout rsync ждал до timeout-minutes.
      # Теперь выкатка падает через минуту тишины, и её можно перезапустить:
      # --delete-after не даст оборванной передаче вычистить сайт.
      - name: Публикация сайта
        run: |
          set -eu
          MAX_DELETE=$((EXPECTED_FILES / 5))
          echo "Файлов в артефакте: $EXPECTED_FILES, предел удаления: $MAX_DELETE"
          cd "$SITE_DIR"
          rsync -e "ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" --timeout=60 \
            --exclude '/api.json' --exclude '/mail' \
            --archive --checksum --progress --compress --delete-after --max-delete="$MAX_DELETE" \
            . dev.doka.guide:/web/sites/doka.guide/www/
