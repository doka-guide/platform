name: Docker Deploy

on:
  push:
    branches:
      - main

permissions: {}

# Без очереди два мёржа подряд собирались параллельно, и тег `latest` мог
# достаться образу старого коммита, если тот собрался позже. Текущую сборку не
# отменяем: отмена между джобами оставила бы образы без тега.
concurrency:
  group: docker-deploy
  cancel-in-progress: false

env:
  IMAGE: dokaguide/platform

jobs:
  # Раньше обе архитектуры собирались в одной джобе через QEMU. Node 24 под
  # эмуляцией arm64 падает с «qemu: uncaught target signal 4 (Illegal
  # instruction)» на npm ci — не всегда, а через раз, в зависимости от того,
  # по каким путям пойдёт JIT. Поэтому каждая архитектура собирается на своём
  # нативном раннере, и эмуляции больше нет вовсе.
  build:
    name: Сборка образа (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Загрузка платформы
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Авторизация на Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Каждая сборка кладёт образ без тега и отдаёт дайджест: тег появится
      # один раз в джобе слияния, когда обе архитектуры готовы.
      - name: Сборка и выгрузка по дайджесту
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Сохранение дайджеста
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Имя артефакта без слэшей
        run: echo "ARTIFACT=digest-${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - name: Выгрузка дайджеста
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  # Тег dokaguide/platform:latest навешивается на манифест из обоих образов.
  # Отдельная джоба нужна, чтобы тег не переезжал на одну архитектуру раньше,
  # чем собралась вторая.
  merge:
    name: Сборка манифеста
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Загрузка дайджестов
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Авторизация на Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Публикация манифеста
        run: |
          set -eu
          cd digests
          # shellcheck disable=SC2046
          docker buildx imagetools create --tag "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Обзор загруженного образа
        run: docker buildx imagetools inspect "$IMAGE:latest"
