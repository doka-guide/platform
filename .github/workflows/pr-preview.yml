name: PR Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  DEPLOY_DOMAIN: https://platform-${{ github.event.pull_request.number }}.dev.doka.guide

jobs:
  # Сообщение о начале сборки. Кода из форка здесь нет, поэтому доступна запись в пулреквест.
  start:
    name: Сообщение о начале
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          MESSAGE: "Идёт сборка и публикация превью... [Подробнее](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        with:
          script: |
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const marker = `<!-- doka-preview-${issue_number} -->`
            const body = `${marker}\n${process.env.MESSAGE}`
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && (comment.body || '').includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  # Сборка кода из форка. В переиспользуемом воркфлоу нет ни одного секрета, а
  # GITHUB_TOKEN урезан до чтения, поэтому выполнение чужого кода (npm ci,
  # *.11tydata.js) ничего не может утащить. Отдельный префикс кеша не даёт форку
  # перезаписать кеш продакшн-деплоя.
  build:
    name: Сборка превью
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/build-site.yml
    # Переиспользуемый воркфлоу не может запросить больше прав, чем дал вызывающий,
    # а на уровне воркфлоу стоит permissions: {} — поэтому выдаём чтение здесь.
    permissions:
      contents: read
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      allow-unsafe-checkout: true
      cache-prefix: pr-preview

  # Валидация собранных страниц. Секретов не требует и работает с тем же
  # артефактом, что и публикация, — сайт больше не собирается второй раз.
  validate:
    name: Валидация разметки
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Нужен только package.json с зависимостями валидатора: сам сайт приезжает
      # артефактом. Код из форка не выполняется — берём базовую ветку.
      - name: Загрузка платформы
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          architecture: x64
      - name: Установка модулей
        run: npm ci
      - name: Загрузка страниц
        uses: actions/download-artifact@v4
        with:
          name: site-html
      # Архив собран кодом из форка. Вычищаем симлинки: иначе член архива может
      # указать куда угодно за пределы dist. Штатная сборка симлинков не создаёт.
      - name: Распаковка страниц
        run: |
          set -eu
          mkdir -p dist
          tar --extract --file site-html.tar --directory dist \
            --no-same-owner --no-same-permissions
          find dist -type l -delete
      - name: Валидация
        run: npm run lint:html

  # Публикация. Здесь есть DEPLOY_KEY, но кода из форка нет — только собранная статика.
  deploy:
    name: Публикация превью
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    env:
      PREVIEW_PATH: /web/sites/dev.doka.guide/platform/${{ github.event.pull_request.number }}
    steps:
      - name: Загрузка артефакта
        uses: actions/download-artifact@v4
        with:
          name: site-dist
      # Опись защищает от обрезанного при передаче архива: дальше идёт rsync с
      # --delete, и неполный артефакт стёр бы недостающее из превью.
      # Разбираем grep-ом, а не source: опись собрана кодом из форка, это данные.
      - name: Проверка артефакта
        run: |
          set -eu
          test -f site-manifest.txt || { echo "В артефакте нет описи"; exit 1; }
          EXPECTED_SHA="$(grep '^sha256=' site-manifest.txt | cut -d= -f2)"
          ACTUAL_SHA="$(sha256sum site.tar | cut -d' ' -f1)"
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "Архив побился при передаче: ждали $EXPECTED_SHA, получили $ACTUAL_SHA"
            exit 1
          fi
          echo "EXPECTED_FILES=$(grep '^files=' site-manifest.txt | cut -d= -f2)" >> "$GITHUB_ENV"
      # Содержимое архива собрано кодом из форка. Распаковываем до записи ключа и
      # вычищаем симлинки: иначе член архива может указать на
      # $HOME/.ssh/doka_deploy и ключ утечёт в публичное превью.
      # Штатная сборка симлинков в dist не создаёт.
      - name: Распаковка артефакта
        run: |
          set -eu
          PREVIEW_DIR="$(mktemp -d "$RUNNER_TEMP/preview.XXXXXX")"
          tar --extract --file site.tar --directory "$PREVIEW_DIR" --no-same-owner --no-same-permissions
          ACTUAL_FILES="$(find "$PREVIEW_DIR" -type f | wc -l | tr -d ' ')"
          if [ "$ACTUAL_FILES" -ne "$EXPECTED_FILES" ]; then
            echo "Распаковалось $ACTUAL_FILES файлов вместо $EXPECTED_FILES"
            exit 1
          fi
          # Симлинки вычищаем после сверки: их удаление не меняет число обычных
          # файлов, но должно случиться до записи ключа.
          find "$PREVIEW_DIR" -type l -delete
          test -f "$PREVIEW_DIR/index.html" || { echo "В артефакте нет index.html"; exit 1; }
          echo "PREVIEW_DIR=$PREVIEW_DIR" >> "$GITHUB_ENV"
      - name: Установка ключа для пользователя
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/doka_deploy"
          chmod 600 "$HOME/.ssh/doka_deploy"
      - name: Публикация превью
        run: |
          set -eu
          SSH_COMMAND="ssh -i $HOME/.ssh/doka_deploy -o StrictHostKeyChecking=no"
          $SSH_COMMAND deploy@dev.doka.guide mkdir -p "$PREVIEW_PATH"
          rsync -e "$SSH_COMMAND" --archive --compress --delete-after --safe-links \
            "$PREVIEW_DIR/" "deploy@dev.doka.guide:$PREVIEW_PATH"
          echo "Ссылка на превью — $DEPLOY_DOMAIN"

  # Итоговый комментарий. always(), иначе при падении сборки пулреквест навсегда
  # останется с сообщением «Идёт сборка...».
  report:
    name: Отчёт в пулреквесте
    needs: [start, build, validate, deploy]
    if: ${{ always() && !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          IS_PUBLISHED: ${{ needs.deploy.result == 'success' }}
          SUCCESS_MESSAGE: '<a href="${{ env.DEPLOY_DOMAIN }}">Превью контента</a> из ${{ github.event.pull_request.head.sha }} опубликовано.'
          FAILURE_MESSAGE: "Превью контента из ${{ github.event.pull_request.head.sha }} не опубликовано. Ошибка сборки или публикации. [Подробнее](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        with:
          script: |
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const marker = `<!-- doka-preview-${issue_number} -->`
            const isPublished = process.env.IS_PUBLISHED === 'true'
            const message = isPublished ? process.env.SUCCESS_MESSAGE : process.env.FAILURE_MESSAGE
            const body = `${marker}\n${message}`
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && (comment.body || '').includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
            if (!isPublished) {
              core.setFailed('Превью не опубликовано')
            }
