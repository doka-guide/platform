name: PR Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  DEPLOY_DOMAIN: https://platform-${{ github.event.pull_request.number }}.dev.doka.guide

jobs:
  # Заметка живёт в описании пулреквеста, а не отдельным комментарием: GitHub
  # шлёт письмо на создание комментария, а правку описания не рассылает вовсе.
  # Кода из форка здесь нет, поэтому доступна запись в пулреквест.
  start:
    name: Заметка о начале
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # Скрипт заметки — только из ветки по умолчанию. `ref` задан явно: джоба
      # ходит с правом записи в пулреквест, и код из форка здесь выполняться не
      # должен. Тот же скрипт пишет заметку в репозитории контента.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v9
        env:
          # То же условие, что у джобы `approve` ниже.
          NEEDS_APPROVAL: ${{ github.event.pull_request.head.repo.full_name != github.repository && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.pull_request.author_association) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const note = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-note.js`)
            const { owner, repo } = context.repo
            const { HEAD_SHA: headSha, RUN_URL: runUrl } = process.env
            const message =
              process.env.NEEDS_APPROVAL === 'true'
                ? `Автор ещё не вносил изменений в репозиторий, превью платформы из ${headSha} ждёт одобрения мейнтейнера. [Подробнее](${runUrl})`
                : `Идёт сборка превью платформы из ${headSha}. [Подробнее](${runUrl})`
            await note.writeNote({
              github,
              owner,
              repo,
              pullNumber: context.payload.pull_request.number,
              message,
              headSha,
            })

  # Одобрение превью для новичков. pull_request_target запускает воркфлоу
  # сразу, без кнопки «Approve and run», которая есть у pull_request. Без этой
  # джобы любой человек мог открыть пулреквест и через несколько минут получить
  # свою страницу на platform-N.dev.doka.guide — под доменом Доки. Окружение
  # `fork-preview` с обязательным ревьюером держит сборку, пока мейнтейнер не
  # посмотрит код.
  #
  # Ждут только пулреквесты из форков от тех, у кого в репозитории ещё нет
  # влитых коммитов, — как одобрение запусков в репозитории контента. Ветки
  # самого репозитория и прежние контрибьюторы (`CONTRIBUTOR`) джобу
  # пропускают. Пока первый пулреквест новичка не вольют, одобрение нужно на
  # каждый его новый коммит.
  #
  # Условие на `full_name`, а не на `head.repo.fork`: у пулреквеста из удалённого
  # форка `head.repo` пуст, и такой пулреквест тоже считается чужим.
  approve:
    name: Одобрение превью новичка
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name != github.repository && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: fork-preview
    permissions: {}
    steps:
      - run: echo "Превью одобрено"

  # Сборка кода из форка. В переиспользуемом воркфлоу нет ни одного секрета, а
  # GITHUB_TOKEN урезан до чтения, поэтому выполнение чужого кода (npm ci,
  # *.11tydata.js) ничего не может утащить. Кеша npm у сборки
  # нет, поэтому форк не может подменить пакеты для выкатки.
  #
  # Функция статуса в `if` нужна, чтобы сборка шла и при пропущенном
  # одобрении: без неё джоба с пропущенной зависимостью пропускается сама.
  build:
    name: Сборка превью
    needs: approve
    if: ${{ !cancelled() && !failure() && !github.event.pull_request.draft }}
    uses: ./.github/workflows/build-site.yml
    # Переиспользуемый воркфлоу не может запросить больше прав, чем дал вызывающий,
    # а на уровне воркфлоу стоит permissions: {} — поэтому выдаём чтение здесь.
    permissions:
      contents: read
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      allow-unsafe-checkout: true

  # Валидация собранных страниц. Секретов не требует и работает с тем же
  # артефактом, что и публикация, — сайт больше не собирается второй раз.
  validate:
    name: Валидация разметки
    needs: build
    # Пропуск джобы `approve` у своих пулреквестов иначе тянется по всей
    # цепочке `needs`, и джоба пропускается, хотя сборка прошла.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Нужен только package.json с зависимостями валидатора: сам сайт приезжает
      # артефактом. Код из форка не выполняется — берём базовую ветку.
      - name: Загрузка платформы
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 17
          distribution: 'temurin'
          architecture: x64
      - name: Установка модулей
        run: npm ci
      - name: Загрузка страниц
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-html
      # Архив собран кодом из форка. Вычищаем симлинки: иначе член архива может
      # указать куда угодно за пределы dist. Штатная сборка симлинков не создаёт.
      - name: Распаковка страниц
        run: |
          set -eu
          mkdir -p dist
          tar --extract --file site-html.tar --directory dist \
            --no-same-owner --no-same-permissions
          find dist -type l -delete
      - name: Валидация
        run: npm run lint:html

  # Публикация. Здесь есть DEPLOY_KEY, но кода из форка нет — только собранная статика.
  deploy:
    name: Публикация превью
    needs: build
    # Пропуск джобы `approve` у своих пулреквестов иначе тянется по всей
    # цепочке `needs`, и джоба пропускается, хотя сборка прошла.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # Без основы (--copy-dest ниже) первая публикация нового пулреквеста льёт
    # весь сайт, около 500 МБ, и при медленном канале до сервера не укладывалась
    # в 20 минут: джоба обрывалась посреди живой передачи, до повторов дело не
    # доходило. Зависание ловит --timeout у rsync, а лимит джобы — только
    # страховка.
    timeout-minutes: 60
    permissions: {}
    env:
      PREVIEW_PATH: /web/sites/dev.doka.guide/platform/${{ github.event.pull_request.number }}
    steps:
      - name: Загрузка артефакта
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
      # Опись защищает от обрезанного при передаче архива: дальше идёт rsync с
      # --delete, и неполный артефакт стёр бы недостающее из превью.
      # Разбираем grep-ом, а не source: опись собрана кодом из форка, это данные.
      - name: Проверка артефакта
        run: |
          set -eu
          test -f site-manifest.txt || { echo "В артефакте нет описи"; exit 1; }
          EXPECTED_SHA="$(grep '^sha256=' site-manifest.txt | cut -d= -f2)"
          ACTUAL_SHA="$(sha256sum site.tar | cut -d' ' -f1)"
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "Архив побился при передаче: ждали $EXPECTED_SHA, получили $ACTUAL_SHA"
            exit 1
          fi
          # В $GITHUB_ENV пишем только проверенное число. Несколько строк files=
          # дописали бы в файл чужие строки, например BASH_ENV с путём к самой
          # описи, и следующий шаг выполнил бы её как скрипт рядом с DEPLOY_KEY.
          EXPECTED_FILES="$(grep '^files=' site-manifest.txt | cut -d= -f2)"
          if ! [[ "$EXPECTED_FILES" =~ ^[0-9]+$ ]]; then
            echo "В описи нет числа файлов"
            exit 1
          fi
          echo "EXPECTED_FILES=$EXPECTED_FILES" >> "$GITHUB_ENV"
      # Содержимое архива собрано кодом из форка. Распаковываем до записи ключа и
      # вычищаем симлинки: иначе член архива может указать на
      # $HOME/.ssh/doka_deploy и ключ утечёт в публичное превью.
      # Штатная сборка симлинков в dist не создаёт.
      - name: Распаковка артефакта
        run: |
          set -eu
          PREVIEW_DIR="$(mktemp -d "$RUNNER_TEMP/preview.XXXXXX")"
          tar --extract --file site.tar --directory "$PREVIEW_DIR" --no-same-owner --no-same-permissions
          ACTUAL_FILES="$(find "$PREVIEW_DIR" -type f | wc -l | tr -d ' ')"
          if [ "$ACTUAL_FILES" -ne "$EXPECTED_FILES" ]; then
            echo "Распаковалось $ACTUAL_FILES файлов вместо $EXPECTED_FILES"
            exit 1
          fi
          # Симлинки вычищаем после сверки: их удаление не меняет число обычных
          # файлов, но должно случиться до записи ключа.
          find "$PREVIEW_DIR" -type l -delete
          test -f "$PREVIEW_DIR/index.html" || { echo "В артефакте нет index.html"; exit 1; }
          echo "PREVIEW_DIR=$PREVIEW_DIR" >> "$GITHUB_ENV"
      - name: Установка ключа для пользователя
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/doka_deploy"
          chmod 600 "$HOME/.ssh/doka_deploy"
      # Соединение с сервером иногда замирает посреди передачи: ssh жив, данные
      # не идут, и rsync без таймаута ждёт до timeout-minutes джобы. --timeout
      # обрывает такую передачу через минуту тишины, ServerAlive — мёртвое
      # соединение. Повтор безопасен: rsync дошлёт только то, что не успел.
      #
      # --checksum, потому что у свежей сборки новые даты у всех файлов, и по
      # размеру с датой rsync считал изменёнными почти все 11 тысяч файлов и
      # переписывал их на сервере. Сборка детерминирована, так что по
      # содержимому меняются только задетые пулреквестом страницы.
      #
      # --stats печатает в конце объём и скорость передачи: по ним видно,
      # медленный ли канал, без доступа к серверу.
      #
      # У нового пулреквеста папка на сервере пустая, и rsync слал весь сайт
      # по сети: при ~300 кБ/с это полчаса и больше. --copy-dest берёт файлы
      # из папок на том же сервере, и по сети едет только разница. Так же
      # устроена выгрузка превью в doka-guide/content: там первая публикация
      # ушла с 25 минут до минуты.
      #
      # rsync ищет в основе файл только по тому же пути. Совпал по содержимому
      # (--checksum) — копирует его на сервере. Не совпал — берёт базой, и по
      # сети едет только разница. Лишнего в превью не попадает. --link-dest
      # вместо копии ставил бы жёсткую ссылку при совпавшем mtime, и у превью
      # с продом появились бы общие файлы.
      #
      # Пути, которые есть только на проде, исключаем: иначе прод служит
      # основой, и --stats выдаёт в публичном логе, есть ли там файл и какого
      # он размера. Шаблоны с якорем: `mail` без него выкинул бы демку
      # html/a/demos/mail/. Скрытых файлов сборка не создаёт.
      #
      # Основы: прод и самое свежее соседнее превью платформы. Прод всегда
      # полный, а свежая папка превью часто ещё выгружается и полупустая.
      # Нет папки или её нельзя прочитать — rsync предупредит и отправит
      # файлы по сети, код выхода не изменится.
      - name: Публикация превью
        run: |
          set -eu
          SSH_COMMAND="ssh -i $HOME/.ssh/doka_deploy -o StrictHostKeyChecking=no -o BatchMode=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          $SSH_COMMAND deploy@dev.doka.guide mkdir -p "$PREVIEW_PATH"

          # Превью лежат на одном диске с продом, а доступа к серверу у
          # мейнтейнеров нет. Свободное место видно хотя бы здесь, в логе.
          $SSH_COMMAND deploy@dev.doka.guide df -h "$PREVIEW_PATH" || true

          PRODUCTION=/web/sites/doka.guide/www
          PREVIEWS="$(dirname "$PREVIEW_PATH")"
          PULL_NUMBER="$(basename "$PREVIEW_PATH")"
          REFERENCE=$($SSH_COMMAND deploy@dev.doka.guide \
            "ls -1t '$PREVIEWS'" 2>/dev/null \
            | grep -E '^[0-9]+$' | grep -vx "$PULL_NUMBER" | head -n 1 || true)
          COPY_DEST=""
          if [ -n "$REFERENCE" ]; then
            COPY_DEST="--copy-dest=$PREVIEWS/$REFERENCE"
            echo "Основа для выгрузки: прод и превью #$REFERENCE."
          else
            echo "Соседнего превью нет, основа — только прод."
          fi

          for attempt in 1 2 3; do
            if rsync -e "$SSH_COMMAND" --timeout=60 --archive --checksum --compress --delete-after --safe-links --stats \
              --exclude '/api.json' --exclude '/mail' --exclude '.*' \
              "--copy-dest=$PRODUCTION" ${COPY_DEST:+"$COPY_DEST"} \
              "$PREVIEW_DIR/" "deploy@dev.doka.guide:$PREVIEW_PATH"; then
              echo "Ссылка на превью — $DEPLOY_DOMAIN"
              exit 0
            fi
            echo "::warning::rsync прервался, попытка $attempt из 3"
            sleep 15
          done
          exit 1

  # Итоговая заметка. always(), иначе при падении сборки пулреквест навсегда
  # останется с сообщением «Идёт сборка...».
  report:
    name: Отчёт в пулреквесте
    needs: [start, approve, build, validate, deploy]
    if: ${{ always() && !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # Скрипт заметки — только из ветки по умолчанию. `ref` задан явно: джоба
      # ходит с правом записи в пулреквест, и код из форка здесь выполняться не
      # должен. Тот же скрипт пишет заметку в репозитории контента.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      # Цвет плашки — как в репозитории контента: зелёная — превью готово,
      # жёлтая — сборку не одобрили, красная — сломалась сборка или публикация.
      - uses: actions/github-script@v9
        env:
          IS_PUBLISHED: ${{ needs.deploy.result == 'success' }}
          IS_REJECTED: ${{ needs.approve.result == 'failure' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const note = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-note.js`)
            const { owner, repo } = context.repo
            const { HEAD_SHA: headSha, RUN_URL: runUrl, DEPLOY_DOMAIN: domain } = process.env
            const isPublished = process.env.IS_PUBLISHED === 'true'
            const isRejected = process.env.IS_REJECTED === 'true'

            let message
            let tone
            if (isPublished) {
              message = `<a href="${domain}">Превью платформы</a> из ${headSha} опубликовано.`
              tone = 'tip'
            } else if (isRejected) {
              message = `Превью платформы из ${headSha} не опубликовано: сборку не одобрили. [Подробнее](${runUrl})`
              tone = 'warning'
            } else {
              message = `Превью платформы из ${headSha} не опубликовано. Ошибка сборки или публикации. [Подробнее](${runUrl})`
              tone = 'caution'
            }

            const written = await note.writeNote({
              github,
              owner,
              repo,
              pullNumber: context.payload.pull_request.number,
              message,
              headSha,
              tone,
            })
            // `null` — в пулреквесте уже есть коммит новее, отчитывается его прогон.
            if (written !== null && tone === 'caution') {
              core.setFailed('Превью не опубликовано')
            }
      # Комментарии прошлой схемы. Убираем оставшиеся, чтобы в ленте не висело
      # вечное «Идёт сборка...». Шаг можно удалить, когда их не останется.
      - name: Уборка старых комментариев
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            for (const comment of comments) {
              const isBot = comment.user?.login === 'github-actions[bot]'
              if (isBot && (comment.body || '').includes('Превью контента')) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id })
              }
            }
